# llm-cost-audit model pricing table
#
# Prices are USD per 1,000,000 tokens (MTok), split into input / output.
# `tier` is one of: frontier | mid | small.
# `cheaper_alternative` names the model the over_modeling analyzer will suggest
# as a downgrade (must itself be a key in this file, or null for none).
#
# These figures are maintained by hand and WILL drift. PRs that correct or
# extend them are very welcome -- update `pricing_as_of` in the same change.
